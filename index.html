<!DOCTYPE html>
<html lang="vi" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HVK • Bio Profile</title>
    <meta name="description" content="Trang cá nhân HVK - ColorOS Aquamorphic Design">
    <link rel="icon" href="logo5.png" type="image/png">

    <!-- Google Fonts: Plus Jakarta Sans (Font chữ hiện đại, rõ nét chuẩn ColorOS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Remix Icon (Bộ Icon nét đậm, sắc nét chuẩn ColorOS) -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Custom CSS: ColorOS 16/17 Aquamorphic Design (Tối ưu hóa hiệu suất tối đa) -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            color: #f8fafc;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Cho phép bôi đen văn bản mượt mà, màu sắc chuẩn ColorOS Aqua */
        ::selection {
            background-color: #00d2c4;
            color: #000000;
        }

        /* Thanh cuộn mảnh, mượt mà */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 210, 196, 0.5);
        }

        /* Thẻ Glassmorphism chuẩn ColorOS 16/17 */
        .coloros-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.04) 100%);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.25);
            border-radius: 28px;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .coloros-card:hover {
            border-color: rgba(0, 210, 196, 0.35);
        }

        /* Nút bấm xúc giác ColorOS */
        .coloros-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.04));
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .coloros-btn:hover {
            transform: translateY(-2px) scale(1.02);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08));
            border-color: rgba(0, 210, 196, 0.45);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .coloros-btn:active {
            transform: scale(0.98);
        }

        /* Khung Avatar bo góc Squircle phát sáng nhẹ */
        .coloros-avatar-frame {
            border-radius: 28px;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2), 0 0 25px rgba(0, 210, 196, 0.35), 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .coloros-avatar-frame:hover {
            transform: scale(1.03);
            box-shadow: 0 0 0 3px rgba(0, 210, 196, 0.5), 0 0 35px rgba(0, 210, 196, 0.5), 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        /* Thanh tiến trình kỹ năng */
        .skill-track {
            height: 9px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .skill-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 relative">

    <!-- ========================================================================== -->

    <!-- ========================================================================== -->
